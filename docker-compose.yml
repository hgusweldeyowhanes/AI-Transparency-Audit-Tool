services:
  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      AUDIT_API_KEY: audit_demo_key
      DATABASE_URL: sqlite:///./data/audit.db
      CORS_ORIGINS: http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - audit-data:/app/data

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:8000
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  audit-data:
